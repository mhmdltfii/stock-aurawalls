
name: Sort Wallpapers and Notify Users

on:
  push:
    branches:
      - main
    paths:
      - 'wallpaper.json'
      - 'OPPO/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sort-wallpapers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Notify users about new wallpapers
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python -m pip install firebase-admin

          python - <<'PY'
          import os
          import json
          import subprocess
          import sys

          with open("wallpaper.json", encoding="utf-8") as f:
              current = json.load(f)

          before = os.environ.get("BEFORE_SHA", "")

          if not before or set(before) == {"0"}:
              previous = []
          else:
              result = subprocess.run(
                  ["git", "show", f"{before}:wallpaper.json"],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print("Tidak bisa membaca data sebelumnya. Notifikasi dilewati.")
                  sys.exit(0)

              previous = json.loads(result.stdout)

          old_ids = {
              str(item["id"])
              for item in previous
              if isinstance(item, dict) and item.get("id") is not None
          }

          new_items = [
              item for item in current
              if isinstance(item, dict)
              and item.get("id") is not None
              and str(item["id"]) not in old_ids
          ]

          if not new_items:
              print("Tidak ada wallpaper baru. Notifikasi dilewati.")
              sys.exit(0)

          import firebase_admin
          from firebase_admin import credentials, messaging

          service_account = json.loads(
              os.environ["FIREBASE_SERVICE_ACCOUNT"]
          )

          firebase_admin.initialize_app(
              credentials.Certificate(service_account)
          )

          latest_name = new_items[-1].get("name", "Wallpaper baru")
          count = len(new_items)

          message = messaging.Message(
              notification=messaging.Notification(
                  title="Wallpaper baru di COS Walls",
                  body=(
                      f"Ada {count} wallpaper baru! "
                      f"Terbaru: {latest_name}"
                  )
              ),
              topic="all_users"
          )

          message_id = messaging.send(message)
          print(f"Notifikasi Firebase berhasil dikirim: {message_id}")
          PY

      - name: Sort wallpapers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/sort_wallpapers.py

      - name: Save sorted JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpaper.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sort wallpapers by latest update"
            git push
          fi
